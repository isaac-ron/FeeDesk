# Render Blueprint — codifies the frontend static site, primarily so the SPA
# rewrite rule lives in version control.
#
# WHY THIS EXISTS
# The frontend is a Render *static site*. Without a rewrite, any direct request
# for a client-side route (refresh on /dashboard, a shared /receipts/:id link,
# the print tab opened with ?print=1) hits Render's host, finds no matching
# file, and returns a plain "Not Found". The `routes` rewrite below serves
# index.html for every unmatched path so React Router can take over.
#
# IMMEDIATE FIX vs THIS FILE
# The fastest fix is the same rule added in the dashboard:
#   Static site → Redirects/Rewrites → Source: /*  Destination: /index.html  (Rewrite)
# This blueprint only takes effect if the service is managed via blueprint sync.
#
# BEFORE SYNCING: confirm `name` and `buildCommand` match the EXISTING service,
# otherwise a sync can create a second, duplicate static site. The backend
# (feedesk-backend) is managed separately and is intentionally not defined here.

services:
  - type: web
    runtime: static
    name: feedesk-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://feedesk-backend.onrender.com/api
    # SPA fallback: serve index.html for any path that isn't a built asset.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
