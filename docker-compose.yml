version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: schoolpay-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: schoolpay
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - schoolpay-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/schoolpay --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolpay-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD}@mongodb:27017/schoolpay?authSource=admin
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80,http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE: 30d
      # M-PESA Daraja API
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      API_BASE_URL: ${API_BASE_URL:-}
      MPESA_IP_WHITELIST_ENABLED: ${MPESA_IP_WHITELIST_ENABLED:-false}
      # TextSMS Kenya
      TEXTSMS_API_KEY: ${TEXTSMS_API_KEY:-}
      TEXTSMS_PARTNER_ID: ${TEXTSMS_PARTNER_ID:-}
      TEXTSMS_SHORTCODE: ${TEXTSMS_SHORTCODE:-SCHOOLPAY}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - schoolpay-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm start

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: schoolpay-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://backend:3000/api
      VITE_SOCKET_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - schoolpay-network

networks:
  schoolpay-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
